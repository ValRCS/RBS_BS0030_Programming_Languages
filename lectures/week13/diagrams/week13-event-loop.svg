<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t d"><title id="t">Simplified JavaScript event-loop teaching model</title><desc id="d">Current JavaScript runs to completion; microtasks run at checkpoints before eligible timer tasks in this example. Host scheduling details vary.</desc><style>text{font-family:Arial,sans-serif;fill:#202020}.head{font-size:24px;font-weight:bold}.body{font-size:17px}.box{fill:#f8f5f1;stroke:#b33;stroke-width:3}.arrow{fill:none;stroke:#555;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="#555"/></marker></defs><rect class="box" x="45" y="40" width="260" height="105" rx="12"/><text class="head" x="75" y="80">Current call stack</text><text class="body" x="75" y="112">Runs to completion</text><rect class="box" x="655" y="40" width="260" height="105" rx="12"/><text class="head" x="695" y="80">Host facilities</text><text class="body" x="695" y="112">Timers and I/O</text><rect class="box" x="45" y="245" width="260" height="105" rx="12"/><text class="head" x="75" y="285">Microtasks</text><text class="body" x="75" y="317">Checkpoint processing</text><rect class="box" x="655" y="245" width="260" height="105" rx="12"/><text class="head" x="695" y="285">Eligible tasks</text><text class="body" x="695" y="317">Timer callbacks, etc.</text><path class="arrow" d="M305 90H650"/><path class="arrow" d="M785 145V240"/><path class="arrow" d="M655 298H310V145"/><path class="arrow" d="M175 245V150"/><text class="body" x="356" y="217">Callbacks execute when the stack is available</text><text class="body" x="355" y="374">Simplified model — Node and browsers have host-specific phases</text></svg>