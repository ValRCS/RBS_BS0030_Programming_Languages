<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">A promise settles once</title>
<desc id="desc">A settled promise retains its outcome. Reactions run through scheduled continuations.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#b73030"/></marker></defs>
<rect width="1200" height="380" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#242424">
<text x="40" y="40" font-size="28" font-weight="bold">A promise settles once</text>
<path d="M330 160 L620 125" stroke="#b73030" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="475.0" y="130.5" font-size="20" text-anchor="middle">fulfill</text>
<path d="M330 215 L620 270" stroke="#b73030" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="475.0" y="230.5" font-size="20" text-anchor="middle">reject</text>
<rect x="50" y="130" width="280" height="135" rx="4" fill="#f7f5f2" stroke="#777" stroke-width="2"/>
<text x="68" y="164" font-size="26" font-weight="bold">Pending</text>
<text x="68" y="200" font-size="22">outcome unknown</text>
<rect x="620" y="75" width="470" height="100" rx="4" fill="#f7f5f2" stroke="#777" stroke-width="2"/>
<text x="638" y="109" font-size="26" font-weight="bold">Fulfilled</text>
<text x="638" y="145" font-size="22">successful value</text>
<rect x="620" y="220" width="470" height="100" rx="4" fill="#f7f5f2" stroke="#777" stroke-width="2"/>
<text x="638" y="254" font-size="26" font-weight="bold">Rejected</text>
<text x="638" y="290" font-size="22">failure reason</text>
<text x="40" y="350" font-size="21">A settled promise retains its outcome. Reactions run through scheduled continuations.</text>
</g></svg>
