<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 688" role="img" aria-labelledby="title description">
  <title id="title">How goroutines abstract execution</title>
  <desc id="description">Five goroutines created by a developer enter the Go runtime scheduler. The runtime multiplexes goroutines across operating-system threads. The operating system schedules those threads on available logical CPU cores. Connections are conceptual, not permanent goroutine-to-thread or thread-to-core assignments.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="688" rx="12" fill="#ffffff"/>
  <text x="40" y="51" fill="#182a3a" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="29">How goroutines abstract execution</text>
  <text x="40" y="81" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="16">The developer defines concurrent work; Go and the OS manage where it executes.</text>

  <text x="40" y="112" fill="#3d5a80" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13">DEVELOPER: STARTS INDEPENDENT WORK</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <g fill="#e0edff" stroke="#6a95c8" stroke-width="1.6">
      <rect x="45" y="130" width="165" height="61" rx="9"/>
      <rect x="230" y="130" width="165" height="61" rx="9"/>
      <rect x="415" y="130" width="165" height="61" rx="9"/>
      <rect x="600" y="130" width="165" height="61" rx="9"/>
      <rect x="785" y="130" width="165" height="61" rx="9"/>
    </g>
    <g font-size="16" font-weight="700" text-anchor="middle" fill="#204d79">
      <text x="127" y="157">G1</text><text x="312" y="157">G2</text><text x="497" y="157">G3</text><text x="682" y="157">G4</text><text x="867" y="157">G5</text>
    </g>
    <g font-size="12" text-anchor="middle" fill="#365b7f">
      <text x="127" y="176">goroutine</text><text x="312" y="176">goroutine</text><text x="497" y="176">goroutine</text><text x="682" y="176">goroutine</text><text x="867" y="176">goroutine</text>
    </g>
  </g>

  <g stroke="#64748b" stroke-width="2" fill="none" stroke-dasharray="5 5">
    <path d="M127 191 V218"/><path d="M312 191 V218"/><path d="M497 191 V218"/><path d="M682 191 V218"/><path d="M867 191 V218"/>
    <path d="M127 218 H867"/>
  </g>
  <path d="M497 218 V248" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <text x="40" y="258" fill="#2c7147" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13">GO RUNTIME: SCHEDULES GOROUTINES</text>
  <rect x="250" y="261" width="500" height="89" rx="11" fill="#e3f3e6" stroke="#60a277" stroke-width="2"/>
  <text x="500" y="293" text-anchor="middle" fill="#205b36" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="21">Go runtime scheduler</text>
  <text x="500" y="320" text-anchor="middle" fill="#2b6944" font-family="Arial, Helvetica, sans-serif" font-size="15">Multiplexes runnable goroutines across OS threads</text>
  <text x="500" y="338" text-anchor="middle" fill="#2b6944" font-family="Arial, Helvetica, sans-serif" font-size="12">A goroutine is not permanently tied to a particular thread</text>
  <path d="M360 350 V399 M640 350 V399" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <text x="40" y="395" fill="#72518d" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13">OPERATING-SYSTEM THREADS</text>
  <g stroke="#9675b2" stroke-width="2" fill="#f2e9fa">
    <rect x="250" y="405" width="220" height="67" rx="9"/>
    <rect x="530" y="405" width="220" height="67" rx="9"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#5c397e">
    <text x="360" y="432" font-size="18" font-weight="700">OS thread 1</text>
    <text x="640" y="432" font-size="18" font-weight="700">OS thread 2</text>
    <text x="360" y="454" font-size="13">Native execution resource</text>
    <text x="640" y="454" font-size="13">Native execution resource</text>
  </g>
  <path d="M360 472 V493 M640 472 V493" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="250" y="500" width="500" height="56" rx="9" fill="#fff2dc" stroke="#cc994b" stroke-width="2"/>
  <text x="500" y="523" text-anchor="middle" fill="#784a15" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18">Operating-system scheduler</text>
  <text x="500" y="544" text-anchor="middle" fill="#875a21" font-family="Arial, Helvetica, sans-serif" font-size="13">Assigns runnable threads to available logical CPUs</text>
  <path d="M360 556 V578 M640 556 V578" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <g fill="#eff2f5" stroke="#a0aebd" stroke-width="1.8">
    <rect x="250" y="585" width="220" height="46" rx="8"/>
    <rect x="530" y="585" width="220" height="46" rx="8"/>
  </g>
  <text x="360" y="614" fill="#34465b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Logical CPU / core</text>
  <text x="640" y="614" fill="#34465b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Logical CPU / core</text>
  <text x="500" y="655" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14">Conceptual layers, not permanent one-to-one assignments.</text>
  <text x="500" y="676" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13">GOMAXPROCS limits OS threads executing user-level Go code simultaneously.</text>
</svg>
